name: Deploy to Pages

on:
  push:
    branches: ["main", "live-iiif"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout live-iiif
        uses: actions/checkout@v4
        with:
          ref: live-iiif
          path: live

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            main/package-lock.json
            live/package-lock.json

      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run build -- --mode=gh

      # The second version is served alongside the first at /live/.
      - name: Build live-iiif
        working-directory: live
        run: |
          npm ci
          npm run build -- --base=/funk-with-iiif/live/
          mv dist ../main/dist/live

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./main/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
